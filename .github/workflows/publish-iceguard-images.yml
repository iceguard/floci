name: Publish IceGuard Images

run-name: Publish IceGuard Floci images from ${{ inputs.source-ref }}

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Floci branch, tag, or commit to publish
        required: true
        type: string
        default: user/ig/aggregate

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish images
    uses: ./.github/workflows/build-images.yml
    with:
      source-ref: ${{ inputs.source-ref }}
      image: ghcr.io/iceguard/floci
